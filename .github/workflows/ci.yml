name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Offline unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable) with dev + viz extras
        # viz pulls in matplotlib so the plots module imports under test.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"

      - name: Run offline unit suite
        # tests/unit/ needs no Neo4j or API key (see pyproject testpaths).
        run: pytest -q
