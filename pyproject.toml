[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "Autonomous LLM agents for Active Directory attack-path discovery on synthetic BloodHound graphs."
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "neo4j>=5.14",
    "python-dotenv>=1.0",
    "requests>=2.31",   # OpenRouter (OpenAI-compatible) HTTP client
    "pandas>=2.0",      # metrics aggregation
]

# Extras are installed only when needed, to keep the base install small.
[project.optional-dependencies]
viz = ["matplotlib>=3.7"]          # scaling plots (experiments/run_benchmark.py)
gemini = ["google-genai>=1.0"]     # optional native Gemini backend
web = ["flask>=3.0"]               # local visualiser (ariadne-web)
dev = ["pytest>=8.0"]              # offline unit tests (tests/unit/)

[project.scripts]
ariadne-chat = "ariadne.chat:main"       # grounded AD security chat assistant
ariadne-web = "ariadne.web.app:main"     # local graph/traversal visualiser

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ariadne.web" = ["static/*"]

[tool.pytest.ini_options]
# Only the offline unit suite runs by default. The scripts directly under
# tests/ are manual smoke checks that need a live Neo4j + LLM key; run those
# by hand (e.g. `python tests/test_tools.py`).
testpaths = ["tests/unit"]
