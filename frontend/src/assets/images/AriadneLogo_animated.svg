<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="circleShade" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#10141f"/>
    </radialGradient>
  </defs>

  <!-- background disc -->
  <circle cx="493" cy="461" r="404" fill="url(#circleShade)"/>

  <!-- faint hexagon -->
  <polygon points="493,231 692,346 692,576 493,691 294,576 294,346"
           fill="none" stroke="#2a3350" stroke-width="1.5" opacity="0.5"/>

  <!-- decorative dots -->
  <g fill="none" stroke="#4b4a8f">
    <circle cx="240" cy="220" r="9" opacity="0.35"/>
    <circle cx="390" cy="228" r="7" opacity="0.3"/>
    <circle cx="570" cy="300" r="8" opacity="0.35"/>
    <circle cx="678" cy="297" r="6" opacity="0.3"/>
    <circle cx="185" cy="385" r="9" opacity="0.3"/>
    <circle cx="305" cy="382" r="7" opacity="0.28"/>
    <circle cx="818" cy="332" r="9" opacity="0.32"/>
    <circle cx="795" cy="398" r="6" opacity="0.28"/>
    <circle cx="838" cy="400" r="8" opacity="0.3"/>
    <circle cx="320" cy="592" r="8" opacity="0.3"/>
    <circle cx="358" cy="602" r="6" opacity="0.28"/>
    <circle cx="372" cy="652" r="7" opacity="0.3"/>
    <circle cx="462" cy="696" r="6" opacity="0.28"/>
    <circle cx="805" cy="540" r="8" opacity="0.3"/>
    <g>
      <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- individually twinkling dots -->
  <circle cx="240" cy="220" r="3" fill="#6a63c9" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="678" cy="297" r="2.6" fill="#6a63c9" opacity="0.5">
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="818" cy="332" r="3" fill="#6a63c9" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="592" r="2.6" fill="#6a63c9" opacity="0.5">
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="805" cy="540" r="3" fill="#6a63c9" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
  </circle>

  <!-- corner brackets -->
  <g stroke="#4c5675" stroke-width="2" fill="none">
    <path d="M85,150 L155,150 L155,220"/>
    <path d="M901,150 L831,150 L831,220"/>
    <path d="M85,835 L155,835 L155,765"/>
    <path d="M901,835 L831,835 L831,765"/>
  </g>
  <g fill="#2dd8b5">
    <circle cx="155" cy="220" r="4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="831" cy="220" r="4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="155" cy="765" r="4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="831" cy="765" r="4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- attack path -->
  <path id="attackPath" d="M492,123 L492,220 L443,220 L443,320
           L588,320 L588,412
           L398,412 L398,511
           L398,600 L542,600 L542,638
           L542,700 L348,700 L348,763
           L492,763 L492,825"
        fill="none" stroke="#2dd8b5" stroke-width="16" opacity="0.25" filter="url(#softGlow)"/>
  <path d="M492,123 L492,220 L443,220 L443,320
           L588,320 L588,412
           L398,412 L398,511
           L398,600 L542,600 L542,638
           L542,700 L348,700 L348,763
           L492,763 L492,825"
        fill="none" stroke="#2dd8b5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-320" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M492,123 L492,220 L443,220 L443,320
           L588,320 L588,412
           L398,412 L398,511
           L398,600 L542,600 L542,638
           L542,700 L348,700 L348,763
           L492,763 L492,825"
        fill="none" stroke="#a8fff0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="14 306">
    <animate attributeName="stroke-dashoffset" from="0" to="-320" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- traveling pulse -->
  <circle r="9" fill="#eafff9" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M492,123 L492,220 L443,220 L443,320
           L588,320 L588,412
           L398,412 L398,511
           L398,600 L542,600 L542,638
           L542,700 L348,700 L348,763
           L492,763 L492,825"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- node template macro (written out per node) -->

  <!-- N0 target (orange) -->
  <g>
    <circle cx="492" cy="123" r="80" fill="#1a6f5c" opacity="0.18"/>
    <circle cx="492" cy="123" r="55" fill="none" stroke="#f5a623" stroke-width="6">
      <animate attributeName="r" values="52;58;52" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="492" cy="123" r="20" fill="#f2960c">
      <animate attributeName="r" values="18;22;18" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- N1 -->
  <g>
    <circle cx="443" cy="320" r="72" fill="#1a6f5c" opacity="0.16"/>
    <circle cx="443" cy="320" r="45" fill="none" stroke="#8b5cf6" stroke-width="5">
      <animate attributeName="r" values="43;48;43" dur="2.6s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="443" cy="320" r="14" fill="#8b5cf6"/>
  </g>

  <!-- N2 -->
  <g>
    <circle cx="588" cy="412" r="68" fill="#1a6f5c" opacity="0.16"/>
    <circle cx="588" cy="412" r="42" fill="none" stroke="#8b5cf6" stroke-width="5">
      <animate attributeName="r" values="40;45;40" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="588" cy="412" r="14" fill="#8b5cf6"/>
  </g>

  <!-- N3 -->
  <g>
    <circle cx="398" cy="511" r="68" fill="#1a6f5c" opacity="0.16"/>
    <circle cx="398" cy="511" r="42" fill="none" stroke="#8b5cf6" stroke-width="5">
      <animate attributeName="r" values="40;45;40" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="398" cy="511" r="14" fill="#8b5cf6"/>
  </g>

  <!-- N4 -->
  <g>
    <circle cx="542" cy="638" r="68" fill="#1a6f5c" opacity="0.16"/>
    <circle cx="542" cy="638" r="42" fill="none" stroke="#8b5cf6" stroke-width="5">
      <animate attributeName="r" values="40;45;40" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="542" cy="638" r="14" fill="#8b5cf6"/>
  </g>

  <!-- N5 -->
  <g>
    <circle cx="348" cy="763" r="72" fill="#1a6f5c" opacity="0.16"/>
    <circle cx="348" cy="763" r="45" fill="none" stroke="#8b5cf6" stroke-width="5">
      <animate attributeName="r" values="43;48;43" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="348" cy="763" r="14" fill="#8b5cf6"/>
  </g>

  <!-- N6 start (blue) -->
  <g>
    <circle cx="492" cy="825" r="76" fill="#1a6f5c" opacity="0.18"/>
    <circle cx="492" cy="825" r="48" fill="none" stroke="#4a90e2" stroke-width="6">
      <animate attributeName="r" values="46;52;46" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="492" cy="825" r="18" fill="#3b82d6">
      <animate attributeName="r" values="16;20;16" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- label -->
  <rect x="378" y="878" width="230" height="58" rx="10" fill="#10141f"/>
  <text x="493" y="915" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="34" font-weight="800" letter-spacing="2" fill="#f4f6fb">ARIADNE</text>
  <text x="493" y="955" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="17" fill="#8891ab">LLM Agent · Attack-Path Benchmark</text>
</svg>
